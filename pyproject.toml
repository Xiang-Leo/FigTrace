[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "figtrace"
version = "0.2.0"
description = "Local-first figure library with a browser workspace"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pillow>=11,<13", "pypdfium2>=4.30,<6", "httpx>=0.28,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
figtrace = "figtrace.cli:main"

[tool.setuptools.packages.find]
include = ["figtrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
